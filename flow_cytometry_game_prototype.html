<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유세포분석기 실전 게임 (프로토타입)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #0b1210;
    color: #e7eeeb;
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif;
  }
  .wrap {
    max-width: 920px;
    margin: 20px auto;
    padding: 0 10px 30px;
  }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #93a69f; margin: 0 0 14px; line-height: 1.6; }
  #gameWrap {
    position: relative;
    width: 900px;
    max-width: 100%;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #2a3b35;
    box-shadow: 0 12px 34px rgba(0,0,0,0.4);
  }
  #numInput {
    position: absolute;
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif;
    font-size: 16px;
    background: #0e1815;
    color: #e7eeeb;
    border: 1.5px solid #35473f;
    border-radius: 6px;
    padding: 0 8px;
    outline: none;
  }
  #numInput:focus { border-color: #4fbfae; }
  .note { margin-top: 14px; font-size: 12px; color: #6b7d76; line-height: 1.7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔬 유세포분석기(Flow Cytometer) 실전 게임 — 프로토타입</h1>
  <p class="sub">면역세포 표면항체 염색부터 기기 셋업, PMT 전압 설정, 측정(Acquisition), 게이팅·분석까지 실제 FACS 분석 워크플로우를 체험합니다. 튜브 배치 순서, 염색 패널 구성, 인큐베이션 타이밍, 전압 설정, 게이팅 정확도가 모두 결과에 반영됩니다.</p>
  <div id="gameWrap">
    <div id="game"></div>
    <input id="numInput" type="number" step="1" placeholder="">
  </div>
  <p class="note">※ 이 버전은 그림 에셋 없이 도형만으로 조작 로직을 테스트하는 프로토타입입니다. 세포 준비·컴펜세이션의 세부 계산은 학습 목적으로 단순화했습니다.</p>
</div>

<script>
(function () {
  var W = 900, H = 700;

  var COLORS = {
    bg: 0x0b1210,
    panel: 0x14201c,
    line: 0x2a3b35,
    lineActive: 0x4fbfae,
    text: 0xe7eeeb,
    textMuted: 0x93a69f,
    ok: 0x4fbfae,
    bad: 0xe0735f,
    warn: 0xd9b564,
    debris: 0x8a9a94,
    doublet: 0xd9b564,
    live: 0x4fbfae
  };

  // ---- layout ----
  var RACK_SLOT_X = [140, 280, 420, 560];
  var RACK_Y = 190;
  var TRAY_Y = 430;
  var PLOT = { x: 70, y: 300, w: 430, h: 220 };
  var LIVE_CENTER = { x: PLOT.x + 250, y: PLOT.y + 110 };
  var LIVE_R = { rx: 70, ry: 45 };
  var DEBRIS_CENTER = { x: PLOT.x + 40, y: PLOT.y + PLOT.h - 30 };
  var DEBRIS_R = { rx: 35, ry: 25 };
  var DOUBLET_CENTER = { x: PLOT.x + 380, y: PLOT.y + 40 };
  var DOUBLET_R = { rx: 22, ry: 18 };

  var STAIN_MIN_MS = 1500, STAIN_IDEAL_MAX_MS = 3200, STAIN_AUTOCAP_MS = 4800;
  var WASH_RECOMMENDED = 2;
  var VOLTAGE_TARGET_POOL = [300, 420, 540, 660];
  var VOLTAGE_IDEAL_TOL = 30, VOLTAGE_HARD_TOL = 90;
  var ACQ_TARGET_MS = 3000;
  var ACQ_TARGET_EVENTS = 10000;
  var CD3_POOL = [58, 64, 70, 76], CD4_POOL = [30, 36, 42, 48], CD8_POOL = [16, 22, 28, 34];

  var TUBES = [
    { id: 'unstained', label: '무염색\n대조군', trayX: RACK_SLOT_X[0], slotIdx: 0, panel: { cd3: false, cd4: false, cd8: false } },
    { id: 'fmo', label: 'FMO\n대조군', trayX: RACK_SLOT_X[1], slotIdx: 1, panel: { cd3: true, cd4: true, cd8: false } },
    { id: 'sampleA', label: '시료 A', trayX: RACK_SLOT_X[2], slotIdx: 2, panel: { cd3: true, cd4: true, cd8: true } },
    { id: 'sampleB', label: '시료 B', trayX: RACK_SLOT_X[3], slotIdx: 3, panel: { cd3: true, cd4: true, cd8: true } }
  ];
  var MARKERS = ['cd3', 'cd4', 'cd8'];
  var MARKER_LABELS = { cd3: 'CD3', cd4: 'CD4', cd8: 'CD8' };

  var config = {
    type: Phaser.AUTO,
    width: W, height: H,
    backgroundColor: '#0b1210',
    parent: 'game',
    scene: { create: create, update: update }
  };

  function freshPanelState() {
    var o = {};
    TUBES.forEach(function (t) { o[t.id] = { cd3: false, cd4: false, cd8: false }; });
    return o;
  }

  var state = {
    step: 1,
    placed: { unstained: false, fmo: false, sampleA: false, sampleB: false },
    panelState: freshPanelState(),
    panelConfirmed: false,
    stainingActive: false, stainingElapsed: 0, stainingDone: false,
    washCount: 0,
    sheathChecked: false, compDone: false,
    voltageTarget: VOLTAGE_TARGET_POOL[Math.floor(Math.random() * VOLTAGE_TARGET_POOL.length)],
    voltageOk: false,
    acqRunning: false, acqElapsed: 0, acqFinished: false, acqReachedFull: false,
    gateConfirmed: false,
    cd3A: CD3_POOL[Math.floor(Math.random() * CD3_POOL.length)],
    cd4A: CD4_POOL[Math.floor(Math.random() * CD4_POOL.length)],
    cd8A: CD8_POOL[Math.floor(Math.random() * CD8_POOL.length)],
    cd3B: CD3_POOL[Math.floor(Math.random() * CD3_POOL.length)],
    cd4B: CD4_POOL[Math.floor(Math.random() * CD4_POOL.length)],
    cd8B: CD8_POOL[Math.floor(Math.random() * CD8_POOL.length)],
    mistakes: 0,
    issues: [],
    done: false
  };

  var refs = { groups: {}, tubeObjs: {}, chipObjs: {} };
  var gateDrag = { active: false, startX: 0, startY: 0 };
  var liveDots = [], debrisDots = [], doubletDots = [];

  new Phaser.Game(config);

  function pushIssue(text) {
    if (state.issues.indexOf(text) === -1) state.issues.push(text);
  }

  function makeClusterDots(cx, cy, rx, ry, n) {
    var arr = [];
    for (var i = 0; i < n; i++) {
      var angle = Math.random() * Math.PI * 2;
      var r = Math.sqrt(Math.random());
      arr.push({ x: cx + Math.cos(angle) * rx * r, y: cy + Math.sin(angle) * ry * r });
    }
    return arr;
  }

  function create() {
    var scene = this;
    refs.scene = scene;

    refs.stepText = scene.add.text(20, 16, '', { fontSize: '15px', fontFamily: 'sans-serif', color: '#e7eeeb', fontStyle: 'bold' });
    refs.hintText = scene.add.text(20, 40, '', { fontSize: '12.5px', fontFamily: 'sans-serif', color: '#93a69f', wordWrap: { width: 610 } });
    refs.feedbackText = scene.add.text(20, H - 56, '', { fontSize: '13px', fontFamily: 'sans-serif', color: '#93a69f', wordWrap: { width: 620 } });
    refs.scoreText = scene.add.text(W - 20, 16, '', { fontSize: '12px', fontFamily: 'sans-serif', color: '#93a69f' }).setOrigin(1, 0);

    scene.add.text(RACK_SLOT_X[0] - 60, RACK_Y - 46, '튜브 랙 (Tube Rack)', { fontSize: '11px', fontFamily: 'sans-serif', color: '#6b7d76' });
    refs.rackProgressText = scene.add.text(560 + 20, RACK_Y - 46, '0 / 4 배치 완료', { fontSize: '11px', fontFamily: 'sans-serif', color: '#d9b564' });

    // ---- tubes (drag) ----
    TUBES.forEach(function (def) {
      var g = scene.add.graphics();
      var label = scene.add.text(0, 0, def.label, { fontSize: '10px', fontFamily: 'sans-serif', color: '#e7eeeb', align: 'center' }).setOrigin(0.5);
      var obj = { def: def, x: def.trayX, y: TRAY_Y, gfx: g, label: label, placed: false };
      refs.tubeObjs[def.id] = obj;
      drawTube(obj);

      var hit = new Phaser.Geom.Rectangle(-22, -26, 44, 52);
      g.setInteractive(hit, Phaser.Geom.Rectangle.Contains);
      scene.input.setDraggable(g);
      g.on('drag', function (pointer, dragX, dragY) {
        obj.x = Phaser.Math.Clamp(dragX, 70, 620);
        obj.y = Phaser.Math.Clamp(dragY, 130, H - 20);
        drawTube(obj);
      });
      g.on('dragend', function () { settleTube(obj); });
    });

    // ---- antibody panel chips (step 2) ----
    TUBES.forEach(function (t) {
      var cx = RACK_SLOT_X[t.slotIdx];
      var chipObjs = {};
      MARKERS.forEach(function (m, mi) {
        var tx = cx + (mi - 1) * 34;
        var ty = RACK_Y + 46;
        var txt = scene.add.text(tx, ty, MARKER_LABELS[m], { fontSize: '10px', fontFamily: 'sans-serif', color: '#6b7d76', backgroundColor: '#14201c', padding: { x: 4, y: 2 } }).setOrigin(0.5).setVisible(false);
        txt.setInteractive(new Phaser.Geom.Rectangle(-16, -10, 32, 20), Phaser.Geom.Rectangle.Contains);
        txt.on('pointerdown', function () { toggleMarker(t.id, m, txt); });
        chipObjs[m] = txt;
      });
      refs.chipObjs[t.id] = chipObjs;
    });

    // ---- FSC/SSC scatter plot area (step 7) ----
    refs.plotGfx = scene.add.graphics().setVisible(false);
    refs.gateRectGfx = scene.add.graphics().setVisible(false);
    refs.plotLabels = [];
    refs.plotLabels.push(scene.add.text(PLOT.x, PLOT.y - 18, 'FSC/SSC 산점도', { fontSize: '11px', fontFamily: 'sans-serif', color: '#6b7d76' }).setVisible(false));
    refs.plotLabels.push(scene.add.text(DEBRIS_CENTER.x, DEBRIS_CENTER.y + DEBRIS_R.ry + 10, '디브리스(Debris)', { fontSize: '9.5px', fontFamily: 'sans-serif', color: '#8a9a94' }).setOrigin(0.5, 0).setVisible(false));
    refs.plotLabels.push(scene.add.text(LIVE_CENTER.x, LIVE_CENTER.y + LIVE_R.ry + 10, '생존세포(Live)', { fontSize: '9.5px', fontFamily: 'sans-serif', color: '#4fbfae' }).setOrigin(0.5, 0).setVisible(false));
    refs.plotLabels.push(scene.add.text(DOUBLET_CENTER.x, DOUBLET_CENTER.y - DOUBLET_R.ry - 20, '응집체(Doublets)', { fontSize: '9.5px', fontFamily: 'sans-serif', color: '#d9b564' }).setOrigin(0.5, 1).setVisible(false));

    liveDots = makeClusterDots(LIVE_CENTER.x, LIVE_CENTER.y, LIVE_R.rx, LIVE_R.ry, 150);
    debrisDots = makeClusterDots(DEBRIS_CENTER.x, DEBRIS_CENTER.y, DEBRIS_R.rx, DEBRIS_R.ry, 55);
    doubletDots = makeClusterDots(DOUBLET_CENTER.x, DOUBLET_CENTER.y, DOUBLET_R.rx, DOUBLET_R.ry, 25);

    refs.finalReadoutGfx = scene.add.graphics().setVisible(false);
    refs.finalReadoutText = scene.add.text(PLOT.x, PLOT.y - 18, '', { fontSize: '11px', fontFamily: 'sans-serif', color: '#93a69f', wordWrap: { width: 430 } }).setVisible(false);

    // Not interactive until step 7 — its bounds (PLOT) overlap the tube tray/rack row
    // used in step 1, and an always-on zone would silently swallow drag events for the
    // tubes underneath it (Phaser only starts a drag for the topmost interactive hit).
    var gateZone = scene.add.zone(PLOT.x, PLOT.y, PLOT.w, PLOT.h).setOrigin(0, 0);
    refs.gateZone = gateZone;
    gateZone.on('pointerdown', function (pointer) {
      if (state.step !== 7 || state.gateConfirmed) return;
      gateDrag.active = true;
      gateDrag.startX = pointer.x; gateDrag.startY = pointer.y;
      drawGateRect(pointer.x, pointer.y, pointer.x, pointer.y);
    });
    scene.input.on('pointermove', function (pointer) {
      if (!gateDrag.active) return;
      drawGateRect(gateDrag.startX, gateDrag.startY, pointer.x, pointer.y);
    });
    scene.input.on('pointerup', function (pointer) {
      if (!gateDrag.active) return;
      gateDrag.active = false;
      evaluateGate(gateDrag.startX, gateDrag.startY, pointer.x, pointer.y);
    });

    // ---- control panel ----
    scene.add.rectangle(660, 120, 220, 560, 0x14201c, 1).setOrigin(0, 0).setStrokeStyle(1, 0x2a3b35);
    scene.add.text(672, 130, '조작 패널', { fontSize: '12.5px', fontFamily: 'sans-serif', color: '#4fbfae', fontStyle: 'bold' });

    buildRackGroup(scene);
    buildPanelGroup(scene);
    buildWashGroup(scene);
    buildSetupGroup(scene);
    buildVoltageGroup(scene);
    buildAcqGroup(scene);
    buildGatingGroup(scene);

    scene.add.text(672, 606, '단계 순서', { fontSize: '11px', fontFamily: 'sans-serif', color: '#4fbfae', fontStyle: 'bold' });
    refs.stepListText = scene.add.text(672, 624, '', { fontSize: '9px', fontFamily: 'sans-serif', color: '#6b7d76', lineSpacing: 2 });

    hideInput();
    setStep(1);
    updateScore();
  }

  // ---------- DOM numeric input ----------
  function positionInput(x, y, w, h, placeholder) {
    var input = document.getElementById('numInput');
    input.style.left = x + 'px'; input.style.top = y + 'px';
    input.style.width = w + 'px'; input.style.height = h + 'px';
    input.placeholder = placeholder || '';
    input.value = '';
    input.focus();
  }
  function hideInput() { document.getElementById('numInput').style.left = '-9999px'; }

  // ---------- drawing helpers ----------
  function drawTube(obj) {
    var g = obj.gfx;
    g.clear();
    if (obj.placed) {
      g.setPosition(obj.x, obj.y);
    } else {
      g.setPosition(obj.x, obj.y);
    }
    g.fillStyle(0xcfd8d4, 1);
    g.fillRoundedRect(-16, -24, 32, 48, 8);
    g.lineStyle(1.5, 0x8a9a94, 1);
    g.strokeRoundedRect(-16, -24, 32, 48, 8);
    obj.label.setPosition(obj.x, obj.y - 38);
    if (obj.placed) {
      g.disableInteractive();
    }
  }

  function makeButton(scene, x, y, w, h, label, onClick) {
    var g = scene.add.graphics();
    g.fillStyle(0x1c2d27, 1);
    g.fillRoundedRect(0, 0, w, h, 6);
    g.lineStyle(1.5, 0x35473f, 1);
    g.strokeRoundedRect(0, 0, w, h, 6);
    g.setPosition(x, y);
    var t = scene.add.text(x + w / 2, y + h / 2, label, { fontSize: '11px', fontFamily: 'sans-serif', color: '#e7eeeb', align: 'center', wordWrap: { width: w - 8 } }).setOrigin(0.5);
    var zone = scene.add.zone(x, y, w, h).setOrigin(0, 0).setInteractive({ useHandCursor: true });
    zone.on('pointerdown', function () { onClick(); });
    return { g: g, t: t, zone: zone };
  }
  function setButtonVisible(btn, v) {
    btn.g.setVisible(v); btn.t.setVisible(v);
    if (v) { btn.zone.setInteractive({ useHandCursor: true }); } else { btn.zone.disableInteractive(); }
  }
  function showOnlyGroup(name) {
    Object.keys(refs.groups).forEach(function (key) {
      var visible = key === name;
      refs.groups[key].forEach(function (obj) {
        if (obj.g && obj.t && obj.zone) { setButtonVisible(obj, visible); }
        else if (obj.setVisible) { obj.setVisible(visible); }
      });
    });
  }

  // ---------- STEP 1: rack loading ----------
  function buildRackGroup(scene) {
    var items = [];
    items.push(scene.add.text(672, 158, '튜브를 랙에 순서대로 배치하세요.', { fontSize: '11px', fontFamily: 'sans-serif', color: '#93a69f', wordWrap: { width: 195 } }));
    items.push(scene.add.text(672, 200, '순서: 무염색 대조군 → FMO 대조군 → 시료 A → 시료 B', { fontSize: '10.5px', fontFamily: 'sans-serif', color: '#6b7d76', wordWrap: { width: 195 } }));
    refs.groups['rack'] = items;
  }
  function computeRackSlot(x, y) {
    if (y < RACK_Y - 40 || y > RACK_Y + 40) return null;
    for (var i = 0; i < RACK_SLOT_X.length; i++) {
      if (Math.abs(x - RACK_SLOT_X[i]) < 50) return i;
    }
    return null;
  }
  function settleTube(obj) {
    if (state.step !== 1) { obj.x = obj.def.trayX; obj.y = TRAY_Y; drawTube(obj); return; }
    var slot = computeRackSlot(obj.x, obj.y);
    if (slot === null) { obj.x = obj.def.trayX; obj.y = TRAY_Y; drawTube(obj); return; }
    if (slot !== obj.def.slotIdx) {
      state.mistakes++; updateScore();
      pushIssue('튜브 배치 순서 오류');
      showFeedback(obj.def.label.replace('\n', ' ') + '을(를) 잘못된 위치에 놓으려 했습니다 — 무염색 대조군→FMO 대조군→시료 A→시료 B 순서로 배치하세요.', false);
      obj.x = obj.def.trayX; obj.y = TRAY_Y;
      drawTube(obj);
      return;
    }
    state.placed[obj.def.id] = true;
    obj.placed = true;
    obj.x = RACK_SLOT_X[slot]; obj.y = RACK_Y;
    drawTube(obj);
    var count = Object.keys(state.placed).filter(function (k) { return state.placed[k]; }).length;
    refs.rackProgressText.setText(count + ' / 4 배치 완료');
    showFeedback(obj.def.label.replace('\n', ' ') + '을(를) 올바른 순서로 배치했습니다.', true);
    if (count === 4) {
      showFeedback('모든 튜브를 순서대로 배치했습니다. 이제 항체 염색 패널을 설정하세요.', true);
      setStep(2);
    }
  }

  // ---------- STEP 2: antibody panel + incubation ----------
  function buildPanelGroup(scene) {
    var items = [];
    items.push(scene.add.text(672, 158, '항체 염색 패널 설정', { fontSize: '11.5px', fontFamily: 'sans-serif', color: '#93a69f' }));
    items.push(scene.add.text(672, 178, '무염색 대조군: 항체 없음 · FMO 대조군: CD3+CD4(CD8 제외) · 시료 A/B: CD3+CD4+CD8 전체', { fontSize: '9.5px', fontFamily: 'sans-serif', color: '#6b7d76', wordWrap: { width: 195 } }));
    refs.panelConfirmBtn = makeButton(scene, 672, 244, 195, 32, '염색 패널 확인', checkPanel); items.push(refs.panelConfirmBtn);
    refs.stainStartBtn = makeButton(scene, 672, 284, 195, 32, '인큐베이션 시작 (4°C, 차광)', startStaining); items.push(refs.stainStartBtn);
    refs.stainTimeText = scene.add.text(672, 324, '', { fontSize: '16px', fontFamily: 'sans-serif', color: '#d9b564', fontStyle: 'bold' });
    items.push(refs.stainTimeText);
    refs.stainEndBtn = makeButton(scene, 672, 350, 195, 32, '인큐베이션 종료 → 세척으로', function () { endStaining(false); }); items.push(refs.stainEndBtn);
    refs.groups['panel'] = items;
  }
  function toggleMarker(tubeId, marker, txt) {
    if (state.step !== 2 || state.panelConfirmed) return;
    state.panelState[tubeId][marker] = !state.panelState[tubeId][marker];
    txt.setColor(state.panelState[tubeId][marker] ? '#0b1210' : '#6b7d76');
    txt.setBackgroundColor(state.panelState[tubeId][marker] ? '#4fbfae' : '#14201c');
  }
  function checkPanel() {
    if (state.step !== 2 || state.panelConfirmed) return;
    var allOk = true, wrongLabels = [];
    TUBES.forEach(function (t) {
      var want = t.panel, have = state.panelState[t.id];
      var ok = (want.cd3 === have.cd3) && (want.cd4 === have.cd4) && (want.cd8 === have.cd8);
      if (!ok) { allOk = false; wrongLabels.push(t.label.replace('\n', ' ')); }
    });
    if (!allOk) {
      state.mistakes++; updateScore();
      pushIssue('염색 패널 설정 오류');
      showFeedback('다음 튜브의 항체 패널이 올바르지 않습니다: ' + wrongLabels.join(', ') + '. 정의를 다시 확인하고 수정하세요.', false);
      return;
    }
    state.panelConfirmed = true;
    TUBES.forEach(function (t) {
      MARKERS.forEach(function (m) { refs.chipObjs[t.id][m].disableInteractive(); });
    });
    showFeedback('모든 튜브의 항체 패널이 올바릅니다. 인큐베이션을 시작하세요(4°C, 차광).', true);
  }
  function startStaining() {
    if (state.step !== 2 || !state.panelConfirmed || state.stainingActive || state.stainingDone) return;
    state.stainingActive = true; state.stainingElapsed = 0;
    showFeedback('염색 항체를 추가했습니다 — 4°C 차광 상태에서 적절한 시점에 인큐베이션을 종료하세요.', true);
  }
  function endStaining(auto) {
    if (state.step !== 2 || !state.stainingActive || state.stainingDone) return;
    state.stainingActive = false; state.stainingDone = true;
    if (auto === true) {
      state.mistakes += 2; updateScore();
      pushIssue('염색 인큐베이션 시간 초과(비특이적 결합 위험)');

  function buildVoltageGroup(scene) {
    var items = [];

  function confirmVoltage() {
    if (state.step !== 5 || state.voltageOk) return;

      state.mistakes++; updateScore();
      pushIssue('PMT 전압 설정 다소 부정확');
      showFeedback('신호가 표준 위치에서 다소 벗어났습니다 — 그래도 진행합니다.', false);

  function pointInEllipseRect(p, rect) {
    return p.x >= rect.x1 && p.x <= rect.x2 && p.y >= rect.y1 && p.y <= rect.y2;
  }
  function drawGateRect(x1, y1, x2, y2) {
    var rx1 = Phaser.Math.Clamp(Math.min(x1, x2), PLOT.x, PLOT.x + PLOT.w);
    var rx2 = Phaser.Math.Clamp(Math.max(x1, x2), PLOT.x, PLOT.x + PLOT.w);
    var ry1 = Phaser.Math.Clamp(Math.min(y1, y2), PLOT.y, PLOT.y + PLOT.h);
    var ry2 = Phaser.Math.Clamp(Math.max(y1, y2), PLOT.y, PLOT.y + PLOT.h);
    var g = refs.gateRectGfx;
    g.clear();
    g.fillStyle(0x4fbfae, 0.12);
    g.fillRect(rx1, ry1, rx2 - rx1, ry2 - ry1);
    g.lineStyle(1.5, 0x4fbfae, 0.9);
    g.strokeRect(rx1, ry1, rx2 - rx1, ry2 - ry1);
  }
  function evaluateGate(x1, y1, x2, y2) {
    if (state.step !== 7 || state.gateConfirmed) return;
    var rx1 = Phaser.Math.Clamp(Math.min(x1, x2), PLOT.x, PLOT.x + PLOT.w);
    var rx2 = Phaser.Math.Clamp(Math.max(x1, x2), PLOT.x, PLOT.x + PLOT.w);
    var ry1 = Phaser.Math.Clamp(Math.min(y1, y2), PLOT.y, PLOT.y + PLOT.h);
    var ry2 = Phaser.Math.Clamp(Math.max(y1, y2), PLOT.y, PLOT.y + PLOT.h);
    var rect = { x1: rx1, y1: ry1, x2: rx2, y2: ry2 };
    var w = rx2 - rx1, h = ry2 - ry1;
    if (w < 40 || h < 40) {
      state.mistakes++; updateScore();
      pushIssue('게이트 크기 오류');
      showFeedback('게이트가 너무 작습니다 — 산점도 위에서 충분히 크게 드래그해 영역을 지정하세요.', false);
      return;
    }
    var hasDebris = pointInEllipseRect(DEBRIS_CENTER, rect);
    var hasDoublet = pointInEllipseRect(DOUBLET_CENTER, rect);
    var hasLive = pointInEllipseRect(LIVE_CENTER, rect);
    if (hasDebris) {
      state.mistakes++; updateScore();
      pushIssue('게이트에 디브리스 포함');
      showFeedback('게이트에 디브리스(세포 파편) 영역이 포함되어 있습니다 — FSC/SSC가 낮은 영역을 제외하고 다시 그리세요.', false);
      return;
    }
    if (hasDoublet) {
      state.mistakes++; updateScore();
      pushIssue('게이트에 응집체(더블릿) 포함');
      showFeedback('게이트에 응집체(더블릿) 영역이 포함되어 있습니다 — 단일세포만 포함하도록 다시 그리세요.', false);
      return;
    }
    if (!hasLive) {
      state.mistakes++; updateScore();
      pushIssue('게이트가 생존세포 집단을 제외함');
      showFeedback('게이트가 생존세포(Live) 집단을 충분히 포함하지 못했습니다 — 다시 그리세요.', false);
      return;
    }
    state.gateConfirmed = true;
    showFeedback('생존세포 게이트를 정확하게 설정했습니다.', true);
    drawFinalReadout();
    setButtonVisible(refs.resultBtn, true);
  }
  function drawFinalReadout() {

  function finishGating() {

  // ---------- update loop (timers) ----------
  function update(time, delta) {
    if (state.step === 2 && state.stainingActive) {
      state.stainingElapsed += delta;
      refs.stainTimeText.setText(Math.round(state.stainingElapsed / 100) / 10 + 's');
      if (state.stainingElapsed >= STAIN_AUTOCAP_MS) { endStaining(true); }
    }
    if (state.step === 6 && state.acqRunning) {
      state.acqElapsed += delta;
      var progress = Math.min(1, state.acqElapsed / ACQ_TARGET_MS);
      var events = Math.round(progress * ACQ_TARGET_EVENTS);
      refs.acqProgressText.setText(events.toLocaleString() + ' / ' + ACQ_TARGET_EVENTS.toLocaleString() + ' events');
      if (progress >= 1) {
        state.acqRunning = false; state.acqFinished = true; state.acqReachedFull = true;
        refs.acqProgressText.setText(ACQ_TARGET_EVENTS.toLocaleString() + ' / ' + ACQ_TARGET_EVENTS.toLocaleString() + ' events — 완료');
        showFeedback('목표 이벤트 수에 도달했습니다. "다음"을 눌러 게이팅으로 이동하세요.', true);
      }
    }
    if (state.step === 6 && refs.acqStopNextBtn) {
      refs.acqStopNextBtn.t.setText(state.acqFinished ? '다음 (게이팅)' : '측정 종료');

  }

  // ---------- step / UI ----------
  var STEP_LABELS = [

    g.beginPath(); g.moveTo(PLOT.x, PLOT.y + PLOT.h); g.lineTo(PLOT.x + PLOT.w, PLOT.y + PLOT.h); g.strokePath();
    g.beginPath(); g.moveTo(PLOT.x, PLOT.y); g.lineTo(PLOT.x, PLOT.y + PLOT.h); g.strokePath();
    debrisDots.forEach(function (p) { g.fillStyle(COLORS.debris, 0.8); g.fillCircle(p.x, p.y, 2); });
    doubletDots.forEach(function (p) { g.fillStyle(COLORS.doublet, 0.8); g.fillCircle(p.x, p.y, 2); });
    liveDots.forEach(function (p) { g.fillStyle(COLORS.live, 0.8); g.fillCircle(p.x, p.y, 2); });
    refs.gateRectGfx.clear();
  }

  function showFeedback(msg, ok) {
    refs.feedbackText.setText((ok ? '✓ ' : '⚠ ') + msg);
    refs.feedbackText.setColor(ok ? '#4fbfae' : '#e0735f');
  }
  function updateScore() {
    refs.scoreText.setText('실수 ' + state.mistakes + '회');
  }

  function showResult() {
    var scene = refs.scene;
    scene.add.rectangle(0, 0, W, H, 0x000000, 0.72).setOrigin(0);
    var grade = state.mistakes === 0 ? 'S — 완벽한 분석' : state.mistakes <= 4 ? 'B — 양호, 세부 동작 점검 필요' : 'C — 재도전 권장';
    var gradeColor = state.mistakes === 0 ? '#4fbfae' : state.mistakes <= 4 ? '#d9b564' : '#e0735f';

    scene.add.rectangle(W / 2, H / 2, 540, 360, 0x14201c, 1).setStrokeStyle(1.5, 0x2a3b35);
    scene.add.text(W / 2, H / 2 - 158, '유세포분석 사이클 완료', { fontSize: '16px', fontFamily: 'sans-serif', color: '#e7eeeb', fontStyle: 'bold' }).setOrigin(0.5);
    scene.add.text(W / 2, H / 2 - 126, grade, { fontSize: '20px', fontFamily: 'sans-serif', color: gradeColor, fontStyle: 'bold' }).setOrigin(0.5);
    scene.add.text(W / 2, H / 2 - 96, '실수 횟수: ' + state.mistakes + '회', { fontSize: '13px', fontFamily: 'sans-serif', color: '#93a69f' }).setOrigin(0.5);

    var issueText = state.issues.length ? state.issues.map(function (s) { return '- ' + s; }).join('\n') : '- 발생한 품질 이슈 없음';
    scene.add.text(W / 2, H / 2 - 68, '품질 이슈 목록', { fontSize: '11.5px', fontFamily: 'sans-serif', color: '#6b7d76', fontStyle: 'bold' }).setOrigin(0.5, 0);
    scene.add.text(W / 2, H / 2 - 48, issueText, { fontSize: '11px', fontFamily: 'sans-serif', color: '#e7eeeb', align: 'left', lineSpacing: 5, wordWrap: { width: 460 } }).setOrigin(0.5, 0);

    scene.add.text(W / 2, H / 2 + 128,
      '튜브 배치 순서, 염색 패널 구성, 인큐베이션 타이밍, 세척, PMT 전압 설정, 측정 완료 여부, 게이팅 정확도가 모두 결과에 반영됩니다.',
      { fontSize: '10.5px', fontFamily: 'sans-serif', color: '#6b7d76', align: 'center', wordWrap: { width: 480 } }).setOrigin(0.5, 0);

    makeButton(scene, W / 2 - 90, H / 2 + 158, 180, 34, '다시 하기 (새 배치)', function () {
      location.reload();
    });
  }

})();
</script>
</body>
</html>
