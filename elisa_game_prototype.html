<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELISA 실전 게임 (프로토타입)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #0b1210;
    color: #e7eeeb;
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif;
  }
  .wrap {
    max-width: 920px;
    margin: 20px auto;
    padding: 0 10px 30px;
  }
  h1 {
    font-size: 19px;
    margin: 0 0 4px;
  }
  .sub {
    font-size: 13px;
    color: #93a69f;
    margin: 0 0 14px;
    line-height: 1.6;
  }
  #gameWrap {
    position: relative;
    width: 900px;
    max-width: 100%;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #2a3b35;
    box-shadow: 0 12px 34px rgba(0,0,0,0.4);
  }
  .note {
    margin-top: 14px;
    font-size: 12px;
    color: #6b7d76;
    line-height: 1.7;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧫 ELISA 실전 게임 — 프로토타입</h1>
  <p class="sub">음성대조군·표준물질 2종·시료 3개를 96웰 스트립에 로딩하고, 세척 → 검출항체 → 세척 → 기질(TMB) 발색까지 실제 순서대로 진행해보세요. 발색을 너무 일찍 멈추거나 너무 오래 두면 결과 판독이 어려워집니다.</p>
  <div id="gameWrap">
    <div id="game"></div>
  </div>
  <p class="note">※ 이 버전은 그림 에셋 없이 도형만으로 조작 로직을 테스트하는 프로토타입입니다. 샌드위치 ELISA(코팅은 사전 완료된 상태로 가정)를 단순화했으며, 실제 세척 횟수·발색 시간·정지 타이밍은 키트·장비에 따라 달라집니다.</p>
</div>

<script>
(function () {
  var W = 900, H = 700;

  var COLORS = {
    bg: 0x0b1210,
    panel: 0x14201c,
    line: 0x2a3b35,
    lineActive: 0x4fbfae,
    text: 0xe7eeeb,
    textMuted: 0x93a69f,
    liquid: 0x3fa9f5,
    ok: 0x4fbfae,
    bad: 0xe0735f,
    warn: 0xd9b564
  };

  // ---- layout constants ----
  var STRIP = { x: 130, y: 170, w: 440, h: 110 };
  var WELL_BASE_X = [190, 260, 330, 400, 470, 540];
  var WELL_Y = 225;
  var WELL_R = 19;
  var TRAY_Y = 605;

  var DEV_MS_PER_PCT = 70;   // elapsed(ms) = pct * rate * DEV_MS_PER_PCT... (see pctFor)
  var GOOD_MIN_PCT = 55;
  var GOOD_MAX_PCT = 125;
  var AUTO_CAP_PCT = 145;

  var TUBES = [
    { id: 'blank', label: '음성\n대조군', trayX: WELL_BASE_X[0], color: 0x8a9a94, rate: 0.03, correctWell: 0 },
    { id: 'stdH', label: '표준액\n(고농도)', trayX: WELL_BASE_X[1], color: 0x9b8fd9, rate: 1.0, correctWell: 1 },
    { id: 'stdL', label: '표준액\n(저농도)', trayX: WELL_BASE_X[2], color: 0xd9b564, rate: 0.42, correctWell: 2 },
    { id: 'sA', label: '시료A', trayX: WELL_BASE_X[3], color: 0x3fa9f5, rate: 0.78, correctWell: 3 },
    { id: 'sB', label: '시료B', trayX: WELL_BASE_X[4], color: 0x3fa9f5, rate: 0.55, correctWell: 4 },
    { id: 'sC', label: '시료C', trayX: WELL_BASE_X[5], color: 0x3fa9f5, rate: 0.15, correctWell: 5 }
  ];

  var config = {
    type: Phaser.AUTO,
    width: W, height: H,
    backgroundColor: '#0b1210',
    parent: 'game',
    scene: { create: create, update: update }
  };

  var state = {
    step: 1,
    wellsFilled: 0,
    wash1Count: 0,
    wash2Count: 0,
    detectAdded: false,
    developing: false,
    devElapsed: 0,
    stopped: false,
    stoppedAuto: false,
    imaged: false,
    mistakes: 0,
    done: false
  };

  var WELLS = [0, 1, 2, 3, 4, 5].map(function () { return { filled: false, tubeId: null, finalPct: 0 }; });

  var refs = {};

  new Phaser.Game(config);

  function getWellX(i) { return WELL_BASE_X[i]; }

  function create() {
    var scene = this;
    refs.scene = scene;

    refs.stepText = scene.add.text(20, 16, '', { fontSize: '15px', fontFamily: 'sans-serif', color: '#e7eeeb', fontStyle: 'bold' });
    refs.hintText = scene.add.text(20, 40, '', { fontSize: '12.5px', fontFamily: 'sans-serif', color: '#93a69f', wordWrap: { width: 610 } });
    refs.feedbackText = scene.add.text(20, H - 56, '', { fontSize: '13px', fontFamily: 'sans-serif', color: '#93a69f', wordWrap: { width: 620 } });
    refs.scoreText = scene.add.text(W - 20, 16, '', { fontSize: '12px', fontFamily: 'sans-serif', color: '#93a69f' }).setOrigin(1, 0);

    // ---- plate strip holder ----
    scene.add.rectangle(STRIP.x + STRIP.w / 2, STRIP.y + STRIP.h / 2, STRIP.w, STRIP.h, 0x1c2d27, 0.55).setStrokeStyle(1, 0x2a3b35);
    scene.add.text(STRIP.x + STRIP.w / 2, STRIP.y - 18, '96웰 플레이트 (8웰 스트립, 6개 사용)', { fontSize: '11px', fontFamily: 'sans-serif', color: '#6b7d76' }).setOrigin(0.5);

    refs.wellNumTexts = [];
    var wellLabels = ['1\n(대조)', '2\n(표준H)', '3\n(표준L)', '4\n(A)', '5\n(B)', '6\n(C)'];
    for (var i = 0; i < 6; i++) {
      refs.wellNumTexts.push(scene.add.text(getWellX(i), WELL_Y + WELL_R + 14, wellLabels[i], { fontSize: '10px', fontFamily: 'sans-serif', color: '#6b7d76', align: 'center' }).setOrigin(0.5, 0));
    }

    refs.wellGfx = scene.add.graphics();
    drawWells();

    // ---- tubes ----
    refs.tubeObjs = {};
    TUBES.forEach(function (t) {
      var g = scene.add.graphics();
      var label = scene.add.text(0, 0, t.label, { fontSize: '10px', fontFamily: 'sans-serif', color: '#e7eeeb', align: 'center' }).setOrigin(0.5);
      var obj = { def: t, x: t.trayX, y: TRAY_Y, gfx: g, label: label, placed: false };
      refs.tubeObjs[t.id] = obj;
      drawTube(obj);

      var hit = new Phaser.Geom.Rectangle(-16, -32, 32, 64);
      g.setInteractive(hit, Phaser.Geom.Rectangle.Contains);
      scene.input.setDraggable(g);

      g.on('drag', function (pointer, dragX, dragY) {
        obj.x = Phaser.Math.Clamp(dragX, 40, W - 260);
        obj.y = Phaser.Math.Clamp(dragY, 130, H - 20);
        drawTube(obj);
        label.setPosition(obj.x, obj.y - 40);
      });
      g.on('dragend', function () {
        settleTube(obj);
      });
    });

    // ---- control panel ----
    scene.add.rectangle(660, 120, 220, 560, 0x14201c, 1).setOrigin(0, 0).setStrokeStyle(1, 0x2a3b35);
    scene.add.text(672, 130, '조작 패널', { fontSize: '12.5px', fontFamily: 'sans-serif', color: '#4fbfae', fontStyle: 'bold' });

    scene.add.text(672, 158, '웰 로딩', { fontSize: '11.5px', fontFamily: 'sans-serif', color: '#93a69f' });
    refs.loadText = scene.add.text(672, 176, '0 / 6 완료', { fontSize: '18px', fontFamily: 'sans-serif', color: '#d9b564', fontStyle: 'bold' });

    scene.add.text(672, 210, '세척 (1차)', { fontSize: '11.5px', fontFamily: 'sans-serif', color: '#93a69f' });
    refs.wash1Text = scene.add.text(672, 228, '0 / 3 회', { fontSize: '16px', fontFamily: 'sans-serif', color: '#e7eeeb', fontStyle: 'bold' });
    refs.wash1Btn = makeButton(scene, 672, 250, 92, 28, '세척', function () { doWash(1); }, true);
    refs.next1Btn = makeButton(scene, 770, 250, 96, 28, '다음 단계', function () { finishWash(1); }, true);

    refs.detectBtn = makeButton(scene, 672, 292, 195, 32, '검출항체(효소표지) 추가', addDetectAb, true);

    scene.add.text(672, 336, '세척 (2차)', { fontSize: '11.5px', fontFamily: 'sans-serif', color: '#93a69f' });
    refs.wash2Text = scene.add.text(672, 354, '0 / 3 회', { fontSize: '16px', fontFamily: 'sans-serif', color: '#e7eeeb', fontStyle: 'bold' });
    refs.wash2Btn = makeButton(scene, 672, 376, 92, 28, '세척', function () { doWash(2); }, true);
    refs.next2Btn = makeButton(scene, 770, 376, 96, 28, '다음 단계', function () { finishWash(2); }, true);

    refs.substrateBtn = makeButton(scene, 672, 418, 195, 32, '기질(TMB) 추가', addSubstrate, true);

    scene.add.text(672, 462, '발색 진행 (표준H 기준)', { fontSize: '11px', fontFamily: 'sans-serif', color: '#93a69f', wordWrap: { width: 195 } });
    refs.devText = scene.add.text(672, 480, '0%', { fontSize: '20px', fontFamily: 'sans-serif', color: '#3fa9f5', fontStyle: 'bold' });
    refs.stopBtn = makeButton(scene, 672, 512, 195, 34, '정지 용액 추가', stopDevelopment, true);

    refs.readerBtn = makeButton(scene, 672, 560, 195, 36, '판독기(플레이트 리더)로 이동', goToReader, true);

    scene.add.text(672, 606, '단계 순서', { fontSize: '11px', fontFamily: 'sans-serif', color: '#4fbfae', fontStyle: 'bold' });
    refs.stepListText = scene.add.text(672, 624, '', { fontSize: '9.5px', fontFamily: 'sans-serif', color: '#6b7d76', lineSpacing: 3 });

    setStep(1);
    updateScore();
  }

  // ---------- drawing helpers ----------

  function lerpColor(c1, c2, t) {
    t = Phaser.Math.Clamp(t, 0, 1);
    var r1 = (c1 >> 16) & 0xff, g1 = (c1 >> 8) & 0xff, b1 = c1 & 0xff;
    var r2 = (c2 >> 16) & 0xff, g2 = (c2 >> 8) & 0xff, b2 = c2 & 0xff;
    var r = Math.round(r1 + (r2 - r1) * t);
    var g = Math.round(g1 + (g2 - g1) * t);
    var b = Math.round(b1 + (b2 - b1) * t);
    return (r << 16) | (g << 8) | b;
  }

  function wellDisplayColor(w) {
    if (!w.filled) return null;
    var pale = 0xdfe7e4;
    if (state.stopped) {
      var t = Math.min(1, w.finalPct / 100);
      return lerpColor(pale, 0xe8d44d, t); // TMB + stop solution -> yellow
    }
    if (state.developing || w.finalPct > 0) {
      var t2 = Math.min(1, w.finalPct / 100);
      return lerpColor(pale, 0x2255cc, t2); // developing TMB -> blue
    }
    return pale;
  }

  function drawWells() {
    var g = refs.wellGfx;
    g.clear();
    for (var i = 0; i < 6; i++) {
      var x = getWellX(i);
      var w = WELLS[i];
      g.lineStyle(1.5, 0x35473f, 1);
      if (w.filled) {
        var col = wellDisplayColor(w);
        g.fillStyle(col, 1);
      } else {
        g.fillStyle(0x0e1815, 1);
      }
      g.fillCircle(x, WELL_Y, WELL_R);
      g.strokeCircle(x, WELL_Y, WELL_R);
      if (w.filled && !state.stopped && w.finalPct > 100) {
        g.lineStyle(2, 0xe0735f, 0.9);
        g.strokeCircle(x, WELL_Y, WELL_R + 4);
      }
    }
  }

  function drawTube(obj) {
    var g = obj.gfx;
    g.clear();
    if (obj.placed) { g.setVisible(false); obj.label.setVisible(false); return; }
    g.setPosition(obj.x, obj.y);
    g.fillStyle(0xcfd8d4, 1);
    g.fillRoundedRect(-13, -30, 26, 52, 6);
    g.lineStyle(1.5, 0x8a9a94, 1);
    g.strokeRoundedRect(-13, -30, 26, 52, 6);
    g.fillStyle(obj.def.color, 0.9);
    g.fillRoundedRect(-9, -6, 18, 24, 3);
    obj.label.setPosition(obj.x, obj.y - 42);
  }

  function makeButton(scene, x, y, w, h, label, onClick, block) {
    var g = scene.add.graphics();
    g.fillStyle(0x1c2d27, 1);
    g.fillRoundedRect(0, 0, w, h, 6);
    g.lineStyle(1.5, 0x35473f, 1);
    g.strokeRoundedRect(0, 0, w, h, 6);
    g.setPosition(x, y);
    var t = scene.add.text(x + w / 2, y + h / 2, label, { fontSize: '11.5px', fontFamily: 'sans-serif', color: '#e7eeeb', align: 'center', wordWrap: { width: w - 8 } }).setOrigin(0.5);
    var zone = scene.add.zone(x, y, w, h).setOrigin(0, 0).setInteractive({ useHandCursor: true });
    zone.on('pointerdown', function () { onClick(); });
    return { g: g, t: t, zone: zone, block: block };
  }

  // ---------- tube / well logic ----------

  function computeNearestWell(x, y) {
    for (var i = 0; i < 6; i++) {
      var wx = getWellX(i);
      if (Math.abs(x - wx) < WELL_R + 10 && Math.abs(y - WELL_Y) < WELL_R + 12) return i;
    }
    return null;
  }

  function settleTube(obj) {
    if (state.step !== 1) {
      obj.x = obj.def.trayX; obj.y = TRAY_Y;
      drawTube(obj);
      return;
    }
    var idx = computeNearestWell(obj.x, obj.y);
    if (idx === null) {
      obj.x = obj.def.trayX; obj.y = TRAY_Y;
      drawTube(obj);
      return;
    }
    if (WELLS[idx].filled) {
      showFeedback('이미 채워진 웰입니다. 다른 웰을 이용하세요.', false);
      obj.x = obj.def.trayX; obj.y = TRAY_Y;
      drawTube(obj);
      return;
    }
    if (obj.def.correctWell === idx) {
      WELLS[idx].filled = true;
      WELLS[idx].tubeId = obj.def.id;
      obj.placed = true;
      drawTube(obj);
      drawWells();
      state.wellsFilled++;
      refs.loadText.setText(state.wellsFilled + ' / 6 완료');
      showFeedback((obj.def.id === 'blank' ? '음성대조군' : obj.def.label.replace('\n', ' ')) + '을(를) ' + (idx + 1) + '번 웰에 정확히 분주했습니다.', true);
      if (state.wellsFilled === 6) {
        setStep(2);
      }
    } else {
      state.mistakes++;
      updateScore();
      showFeedback('플레이트 맵과 다른 위치입니다 — ' + (obj.def.correctWell + 1) + '번 웰에 분주해야 나중에 표준곡선·시료 순서를 정확히 해석할 수 있습니다.', false);
      obj.x = obj.def.trayX; obj.y = TRAY_Y;
      drawTube(obj);
    }
  }

  // ---------- washing ----------

  function doWash(phase) {
    if (state.step !== (phase === 1 ? 2 : 4)) return;
    if (phase === 1) {
      state.wash1Count++;
      refs.wash1Text.setText(state.wash1Count + ' / 3 회');
      showFeedback('세척 완료 (' + state.wash1Count + '회) — 미결합 물질을 씻어내는 중입니다.', true);
    } else {
      state.wash2Count++;
      refs.wash2Text.setText(state.wash2Count + ' / 3 회');
      showFeedback('세척 완료 (' + state.wash2Count + '회) — 미결합 검출항체를 씻어내는 중입니다.', true);
    }
  }

  function finishWash(phase) {
    if (state.step !== (phase === 1 ? 2 : 4)) return;
    var count = phase === 1 ? state.wash1Count : state.wash2Count;
    if (count < 3) {
      state.mistakes++;
      updateScore();
      showFeedback('세척 횟수가 부족합니다(권장 3회, 현재 ' + count + '회) — 비특이적으로 남은 물질 때문에 배경 신호(백그라운드)가 높아질 수 있습니다. 그래도 다음 단계로 진행합니다.', false);
    } else {
      showFeedback('세척이 충분히 이루어졌습니다. 다음 단계로 진행합니다.', true);
    }
    setStep(phase === 1 ? 3 : 5);
  }

  // ---------- detection antibody ----------

  function addDetectAb() {
    if (state.step !== 3) return;
    if (state.detectAdded) return;
    state.detectAdded = true;
    showFeedback('검출항체(효소표지)를 모든 웰에 추가했습니다. 반응 후 세척으로 넘어가세요.', true);
    setStep(4);
  }

  // ---------- substrate / development ----------

  function pctFor(rate, elapsedMs) {
    return elapsedMs / DEV_MS_PER_PCT * rate;
  }

  function addSubstrate() {
    if (state.step !== 5) return;
    if (state.developing || state.stopped) return;
    state.developing = true;
    state.devElapsed = 0;
    showFeedback('기질(TMB)을 추가했습니다 — 발색이 진행됩니다. 표준H 웰의 색이 짙어지는 것을 지켜보다 적절한 시점에 "정지 용액 추가"를 누르세요.', true);
    setStep(6);
  }

  function updateDevelopment(delta) {
    state.devElapsed += delta;
    var maxPct = 0;
    for (var i = 0; i < 6; i++) {
      var w = WELLS[i];
      var t = TUBES[i];
      w.finalPct = pctFor(t.rate, state.devElapsed);
      if (t.id === 'stdH') maxPct = w.finalPct;
    }
    refs.devText.setText(Math.round(maxPct) + '%');
    drawWells();
    if (maxPct >= AUTO_CAP_PCT) {
      stopDevelopment(true);
    }
  }

  function stopDevelopment(auto) {
    if (state.step !== 6 || !state.developing) return;
    state.developing = false;
    state.stopped = true;
    var stdHPct = 0;
    for (var i = 0; i < 6; i++) { if (TUBES[i].id === 'stdH') stdHPct = WELLS[i].finalPct; }

    if (auto === true) {
      state.stoppedAuto = true;
      state.mistakes += 2;
      updateScore();
      showFeedback('정지 시점을 놓쳐 반응이 완전히 포화되었습니다 — 고농도 표준액과 시료들이 모두 진한 색으로 뭉쳐 서로 구별할 수 없습니다.', false);
    } else if (stdHPct < GOOD_MIN_PCT) {
      state.mistakes++;
      updateScore();
      showFeedback('발색이 충분히 진행되지 않았습니다(표준H 기준 약 ' + Math.round(stdHPct) + '%) — 신호가 약해 표준곡선을 그리기 어렵습니다.', false);
    } else if (stdHPct > GOOD_MAX_PCT) {
      state.mistakes++;
      updateScore();
      showFeedback('발색이 다소 과하게 진행되었습니다(표준H 기준 약 ' + Math.round(stdHPct) + '%) — 고농도 구간의 구별력이 떨어질 수 있습니다.', false);
    } else {
      showFeedback('적절한 시점(표준H 기준 약 ' + Math.round(stdHPct) + '%)에 정지 용액 추가했습니다 — 청색이 노란색으로 바뀝니다.', true);
    }
    drawWells();
    setStep(7);
  }

  function update(time, delta) {
    if (state.step === 6 && state.developing) {
      updateDevelopment(delta);
    }
  }

  // ---------- reader ----------

  function goToReader() {
    if (state.step !== 7) return;
    if (!state.imaged) {
      state.imaged = true;
      showFeedback('플레이트 리더로 옮겼습니다. 각 웰의 최종 색(흡광도)을 확인한 뒤 "결과 등급 확인"을 누르세요.', true);
      refs.readerBtn.t.setText('결과 등급 확인');
      return;
    }
    showResult();
  }

  // ---------- step / UI ----------

  var STEP_LABELS = [
    '1. 대조군·표준액·시료 로딩',
    '2. 1차 세척',
    '3. 검출항체(효소표지) 추가',
    '4. 2차 세척',
    '5. 기질(TMB) 추가',
    '6. 발색 관찰 → 정지 용액 추가',
    '7. 판독기로 결과 확인'
  ];

  function setStep(n) {
    state.step = n;
    var titles = {
      1: '1단계 — 대조군·표준액·시료 로딩',
      2: '2단계 — 1차 세척',
      3: '3단계 — 검출항체 추가',
      4: '4단계 — 2차 세척',
      5: '5단계 — 기질(TMB) 추가',
      6: '6단계 — 발색 진행 중',
      7: '7단계 — 판독',
      8: '완료!'
    };
    var hints = {
      1: '튜브를 드래그해서 플레이트 맵대로 올바른 웰에 넣으세요. 음성대조군 → 표준액(고→저농도) → 시료 순서입니다.',
      2: '오른쪽 "세척" 버튼을 여러 번 눌러 미결합 물질을 씻어내세요(권장 3회). 충분히 세척한 뒤 "다음 단계"를 누르세요.',
      3: '"검출항체(효소표지) 추가" 버튼을 눌러 모든 웰에 검출항체를 넣으세요.',
      4: '검출항체 반응 후에도 세척이 필요합니다 — "세척" 버튼을 눌러 미결합 항체를 씻어내세요(권장 3회).',
      5: '"기질(TMB) 추가" 버튼을 눌러 발색 반응을 시작하세요.',
      6: '표준H 웰(2번)의 색이 짙어지는 것을 지켜보세요. 색이 충분히(하지만 포화되기 전) 짙어졌을 때 "정지 용액 추가.를 누르세요.',
      7: '"판독기(플레이트 리더)로 이동" 버튼으로 최종 결과를 확인하세요.',
      8: '아래 결과를 확인하세요.'
    };
    refs.stepText.setText(titles[n] || '');
    refs.hintText.setText(hints[n] || '');
    refs.stepListText.setText(STEP_LABELS.map(function (s, i) {
      var active = n === i + 1;
      return (active ? '▶ ' : '   ') + s;
    }).join('\n'));
  }

  function showFeedback(msg, ok) {
    refs.feedbackText.setText((ok ? '✓ ' : '⚠ ') + msg);
    refs.feedbackText.setColor(ok ? '#4fbfae' : '#e0735f');
  }

  function updateScore() {
    refs.scoreText.setText('실수 ' + state.mistakes + '회');
  }

  function odFor(w) {
    if (state.stoppedAuto && w.finalPct >= 100) return '≥3.00 (포화)';
    var od = Math.min(3.0, (w.finalPct / 100) * 2.5);
    return od.toFixed(2);
  }

  function showResult() {
    var scene = refs.scene;
    var overlay = scene.add.rectangle(0, 0, W, H, 0x000000, 0.72).setOrigin(0);
    var grade = state.mistakes === 0 ? 'S — 완벽한 ELISA SOP 수행' : state.mistakes <= 2 ? 'B — 양호, 세부 동작 점검 필요' : 'C — 재도전 권장';
    var gradeColor = state.mistakes === 0 ? '#4fbfae' : state.mistakes <= 2 ? '#d9b564' : '#e0735f';

    scene.add.rectangle(W / 2, H / 2, 520, 340, 0x14201c, 1).setStrokeStyle(1.5, 0x2a3b35);

    scene.add.text(W / 2, H / 2 - 148, 'ELISA 사이클 완료', { fontSize: '16px', fontFamily: 'sans-serif', color: '#e7eeeb', fontStyle: 'bold' }).setOrigin(0.5);
    scene.add.text(W / 2, H / 2 - 116, grade, { fontSize: '20px', fontFamily: 'sans-serif', color: gradeColor, fontStyle: 'bold' }).setOrigin(0.5);
    scene.add.text(W / 2, H / 2 - 86, '실수 횟수: ' + state.mistakes + '회' + (state.stoppedAuto ? ' (발색 포화 발생)' : ''), { fontSize: '13px', fontFamily: 'sans-serif', color: '#93a69f' }).setOrigin(0.5);

    var lines = TUBES.map(function (t, i) {
      var w = WELLS[i];
      var name = t.id === 'blank' ? '음성대조군' : t.label.replace('\n', ' ');
      return (i + 1) + '번 ' + name + ' — OD(450nm) ' + odFor(w);
    }).join('\n');
    scene.add.text(W / 2, H / 2 - 58, lines, { fontSize: '11.5px', fontFamily: 'sans-serif', color: '#e7eeeb', align: 'left', lineSpacing: 5 }).setOrigin(0.5, 0);

    scene.add.text(W / 2, H / 2 + 108,
      '웰 로딩 순서·세척 횟수·발색 정지 타이밍이 모두 결과에 반영됩니다.',
      { fontSize: '11px', fontFamily: 'sans-serif', color: '#6b7d76', align: 'center' }).setOrigin(0.5, 0);

    makeButton(scene, W / 2 - 90, H / 2 + 138, 180, 34, '다시 하기 (새 배치)', function () {
      location.reload();
    }, true);
  }

})();
</script>
</body>
</html>
